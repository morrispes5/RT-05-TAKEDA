openapi: 3.1.0
info:
  title: RT05 TAKEDA REST API
  version: 1.0.0-m12
  summary: Kontrak HTTP v1 untuk website CMS, aplikasi mobile, dan worker.
  description: |
    Desain manusia ada di docs/API.md; file ini kontrak mesin.
    `x-status: implemented` berarti endpoint ada dan diuji (OpenApiContractTest).
    `x-status: planned` berarti dirancang untuk milestone `x-milestone` dan BELUM tersedia.
    JSON snake_case, UUID, timestamp ISO-8601 UTC, period YYYY-MM, rupiah integer.
    Iuran dibayar offline dan dicatat pengurus; tidak ada payment gateway atau checkout.
  contact:
    name: Pengelola RT05 TAKEDA
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: https://takeda.morriz.tech
    description: Production (rancangan, belum live)
  - url: https://takeda-staging.morriz.tech
    description: Staging (rancangan, belum live)
  - url: http://127.0.0.1:8000
    description: Lokal (php artisan serve)
tags:
  - name: Operations
    description: Health, info layanan, audit, ekspor, versi aplikasi
  - name: Identity
    description: Akun, login, token registrasi 6 digit
  - name: Residents
    description: Rumah, keluarga, anggota, hunian, akun tambahan
  - name: Complaints
    description: Pengaduan warga dan status
  - name: Aspirations
    description: Aspirasi warga, terpisah dari pengaduan
  - name: Community
    description: Agenda, pengumuman, notifikasi, perangkat push
  - name: Finance
    description: Tarif, tagihan, pencatatan iuran offline, kas; tanpa payment gateway
  - name: Content
    description: Profil, fasilitas, artikel, album publik dan CMS
  - name: Media
    description: Upload privat dan pemrosesan foto
paths:
  /api/v1:
    get:
      operationId: serviceInfo
      tags:
        - Operations
      summary: Identitas layanan API v1.
      x-status: implemented
      x-milestone: M02
      security: []
      responses:
        "200":
          description: Informasi layanan.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceInfoEnvelope"
              example:
                data:
                  name: RT05 TAKEDA API
                  api_version: v1
                meta:
                  request_id: 0f8e6c1e-7d3b-4c55-9a40-6f1f2d3e4b5a
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/admin/accounts:
    get:
      operationId: getAccountsAdminAccounts
      tags:
        - Residents
      summary: accounts /admin/accounts
      x-status: implemented
      x-milestone: M07
      responses:
        "200":
          $ref: "#/components/responses/Data"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/admin/accounts/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: adminAccountsShow
      tags:
        - Residents
      summary: Detail akun, riwayat tautan dan permohonan
      x-status: implemented
      x-milestone: M07
      responses:
        "200":
          $ref: "#/components/responses/Data"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: patchUpdateAccountAdminAccounts
      tags:
        - Residents
      summary: Aktif/nonaktif akun dengan alasan; peran tidak diterima
      x-status: implemented
      x-milestone: M07
      description: Nonaktif mencabut bearer dan sesi. Akun diarsipkan → 409 ACCOUNT_ARCHIVED; menunggu → 422 PENDING_ACCOUNT; akun sendiri → 422.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountStatusInput"
      responses:
        "200":
          $ref: "#/components/responses/Data"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/admin/accounts/{id}/archive:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: adminAccountsArchive
      tags:
        - Residents
      summary: Arsip akun warga, tutup tautan, cabut akses
      x-status: implemented
      x-milestone: M07
      description: Final. Akun pengurus → 422 ADMIN_ARCHIVE_OPERATOR_ONLY; permohonan diajukan → 409 REQUEST_PENDING.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReasonInput"
      responses:
        "200":
          $ref: "#/components/responses/Data"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/admin/accounts/{id}/role:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: adminAccountsRole
      tags:
        - Residents
      summary: Jadikan pengurus atau turunkan jadi warga (khusus super admin)
      description: ADR43 (M17). Hanya akun pengurus aktif dengan email super admin (RT05_SUPER_ADMIN_EMAIL) → selain itu 403 SUPER_ADMIN_REQUIRED. Akun sendiri → 422 SELF_ROLE_CHANGE; menaikkan akun tidak aktif → 422 ACCOUNT_NOT_ACTIVE; pengurus aktif terakhir → 422 LAST_PENGURUS. Semua sesi akun tujuan diakhiri; audit memuat alasan; pemilik akun mendapat notifikasi sistem. Respons sama dengan GET /admin/accounts/{id}.
      x-status: implemented
      x-milestone: M17
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [peran, alasan]
              properties:
                peran: {type: string, enum: [pengurus, warga]}
                alasan: {type: string, maxLength: 300}
      responses:
        "200":
          $ref: "#/components/responses/Data"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/admin/accounts/{id}/restore:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: adminAccountsRestore
      tags:
        - Residents
      summary: Pulihkan akun arsip
      description: Akun kembali nonaktif (pengurus mengaktifkan lagi); tautan keluarga tidak dibuka otomatis. Bukan arsip → 409 NOT_ARCHIVED. Arsip yang sudah dianonimkan (lebih dari 12 bulan, M17) → 409 ANONYMIZED.
      x-status: implemented
      x-milestone: M15
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReasonInput"
      responses:
        "200":
          $ref: "#/components/responses/Data"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/admin/additional-account-requests:
    get:
      operationId: adminAdditionalRequestsIndex
      tags:
        - Residents
      summary: Daftar permohonan akun tambahan
      x-status: implemented
      x-milestone: M07
      responses:
        "200":
          $ref: "#/components/responses/Data"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/admin/additional-account-requests/{id}/approve:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: adminAdditionalRequestsApprove
      tags:
        - Residents
      summary: Setujui permohonan; tautan akun tambahan + keanggotaan atomik
      x-status: implemented
      x-milestone: M07
      description: warga_id opsional menautkan anggota aktif tanpa akun. 409 REQUEST_ALREADY_PROCESSED/RESIDENT_HAS_ACCOUNT; 422 HOUSE_NOT_OCCUPIED.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApproveRequestInput"
      responses:
        "200":
          $ref: "#/components/responses/Data"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/admin/additional-account-requests/{id}/reject:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: adminAdditionalRequestsReject
      tags:
        - Residents
      summary: Tolak permohonan dengan alasan
      x-status: implemented
      x-milestone: M07
      responses:
        "200":
          $ref: "#/components/responses/Data"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/admin/additional-account-requests/{id}/revision:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: adminAdditionalRequestsRevision
      tags:
        - Residents
      summary: Minta pemohon akun tambahan memperbaiki data (UAT M15)
      x-status: implemented
      x-milestone: M15
      description: Hanya permohonan tambahan berstatus diajukan; catatan wajib 5–300 karakter. Status menjadi perlu_revisi, akun tetap menunggu; catatan tampil di status pemohon. Selain diajukan 409 REQUEST_ALREADY_PROCESSED.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [catatan]
              properties:
                catatan:
                  type: string
                  minLength: 5
                  maxLength: 300
      responses:
        "200":
          $ref: "#/components/responses/Data"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/admin/agendas:
    get:
      operationId: adminAgendasIndex
      tags:
        - Community
      summary: Kelola agenda
      x-status: planned
      x-milestone: M10
      responses:
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: adminAgendasStore
      tags:
        - Community
      summary: Buat agenda
      description: Waktu ISO 8601 dengan zona eksplisit; mulai harus di masa depan. Warga aktif diberi tahu (inbox + push).
      x-status: implemented
      x-milestone: M10
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AgendaInput'}
      responses:
        "201":
          description: Agenda dibuat.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AgendaEnvelope'}
        default:
          $ref: "#/components/responses/Error"
  /api/v1/admin/agendas/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    put:
      operationId: putUpdateAgendaAdminAgendas
      tags:
        - Community
      summary: Ubah agenda
      description: >-
        Ganti penuh. Waktu baru wajib di masa depan; ubah deskripsi agenda lewat tetap boleh.
        Perubahan waktu/lokasi memberi tahu warga dan menjadwalkan ulang pengingat H-1.
      x-status: implemented
      x-milestone: M10
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AgendaInput'}
      responses:
        "200":
          description: Agenda diperbarui.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AgendaEnvelope'}
        default:
          $ref: "#/components/responses/Error"
  /api/v1/admin/agendas/{id}/archive:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: postArchiveAgendaAdminAgendas
      tags:
        - Community
      summary: archiveAgenda /admin/agendas/{id}/archive
      x-status: implemented
      x-milestone: M10
      responses:
        "204":
          description: Berhasil tanpa body.
        default:
          $ref: "#/components/responses/Error"
  /api/v1/admin/announcements:
    get:
      operationId: adminAnnouncementsIndex
      tags:
        - Community
      summary: Kelola pengumuman
      x-status: planned
      x-milestone: M10
      responses:
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: adminAnnouncementsStore
      tags:
        - Community
      summary: Buat pengumuman
      x-status: implemented
      x-milestone: M10
      responses:
        "201":
          $ref: "#/components/responses/Data"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/admin/announcements/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    put:
      operationId: putUpdateAnnouncementAdminAnnouncements
      tags:
        - Community
      summary: updateAnnouncement /admin/announcements/{id}
      x-status: implemented
      x-milestone: M10
      responses:
        "200":
          $ref: "#/components/responses/Data"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/admin/announcements/{id}/archive:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: postArchiveAnnouncementAdminAnnouncements
      tags:
        - Community
      summary: archiveAnnouncement /admin/announcements/{id}/archive
      x-status: implemented
      x-milestone: M10
      responses:
        "204":
          description: Berhasil tanpa body.
        default:
          $ref: "#/components/responses/Error"
  /api/v1/admin/aspirations/{id}/archive:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: adminAspirationsArchive
      tags:
        - Aspirations
      summary: Arsip aspirasi dengan alasan
      x-status: implemented
      x-milestone: M09
      description: Hanya menyembunyikan dari warga; aspirasi dan riwayat tetap. Alasan wajib (422). Sudah diarsipkan 409 ALREADY_ARCHIVED.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReasonInput"
      responses:
        "204":
          description: Berhasil tanpa body.
        default:
          $ref: "#/components/responses/Error"
  /api/v1/admin/aspirations/{id}/status:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: adminAspirationsStatus
      tags:
        - Aspirations
      summary: Ubah status dengan catatan dan expected_version
      x-status: implemented
      x-milestone: M09
      description: 'diajukan → ditinjau → selesai; selesai → ditinjau (buka ulang) wajib catatan 422 REOPEN_REASON_REQUIRED. Transisi lain 422 INVALID_STATUS_TRANSITION, versi basi 409 VERSION_CONFLICT, aspirasi arsip 409 ALREADY_ARCHIVED. Riwayat, audit, dan outbox (inbox pengirim) ditulis dalam transaksi yang sama. Hanya pengurus; selain itu 403.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AspirationStatusInput"
      responses:
        "200":
          description: Respons berhasil.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AspirationEnvelope"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/admin/audit-logs:
    get:
      operationId: adminAuditLogs
      tags:
        - Operations
      summary: Jejak audit
      x-status: implemented
      x-milestone: M07
      responses:
        "200":
          $ref: "#/components/responses/Data"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/admin/cash-transactions:
    get:
      operationId: adminCashIndex
      tags:
        - Finance
      summary: Daftar kas
      description: Setiap baris memuat `dapat_dibalik` (kas manual non-iuran yang belum dibalik); `meta.saldo` dari ledger.
      x-status: implemented
      x-milestone: M12
      responses:
        "200":
          $ref: "#/components/responses/Data"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: adminCashStore
      tags:
        - Finance
      summary: Pemasukan lain/pengeluaran/saldo awal (bukan iuran)
      description: >-
        Bila hasilnya membuat saldo negatif, 422 NEGATIVE_BALANCE_CONFIRMATION_REQUIRED tanpa tulisan apa pun; kirim ulang
        dengan `konfirmasi_saldo_negatif: true` (kunci yang sama boleh dipakai karena penolakan tidak menyimpan reservasi).
        Respons yang tetap negatif memuat `meta.peringatan`. Saldo awal hanya sekali (409 OPENING_BALANCE_EXISTS).
      x-status: implemented
      x-milestone: M12
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [jenis, nominal, tanggal, kategori, keterangan]
              properties:
                jenis: {type: string, enum: [pemasukan, pengeluaran, saldo_awal]}
                nominal: {type: integer, minimum: 1, maximum: 1000000000}
                tanggal: {type: string, format: date, description: 'Paling lambat hari ini (WIB).'}
                kategori: {type: string, maxLength: 60}
                keterangan: {type: string, minLength: 5, maxLength: 500}
                konfirmasi_saldo_negatif: {type: boolean}
      responses:
        "201":
          $ref: "#/components/responses/Data"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/admin/cash-transactions/{id}/reverse:
    parameters:
      - $ref: "#/components/parameters/Id"
      - $ref: "#/components/parameters/IdempotencyKey"
    post:
      operationId: adminCashReverse
      tags:
        - Finance
      summary: Satu pembalikan kas dengan alasan
      x-status: implemented
      x-milestone: M12
      responses:
        "200":
          $ref: "#/components/responses/Data"
        default:
          $ref: "#/components/responses/Error"
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
  /api/v1/admin/complaints/{id}/archive:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: adminComplaintsArchive
      tags:
        - Complaints
      summary: Arsip pengaduan dengan alasan
      x-status: implemented
      x-milestone: M08
      description: Hanya menyembunyikan dari warga; laporan, foto, dan riwayat tetap. Sudah diarsipkan 409 ALREADY_ARCHIVED.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReasonInput"
      responses:
        "204":
          description: Berhasil tanpa body.
        default:
          $ref: "#/components/responses/Error"
  /api/v1/admin/complaints/{id}/status:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: adminComplaintsStatus
      tags:
        - Complaints
      summary: Ubah status dengan catatan dan expected_version
      x-status: implemented
      x-milestone: M08
      description: 'diajukan → diproses → selesai; selesai → diproses (buka ulang) wajib catatan 422 REOPEN_REASON_REQUIRED. Transisi lain 422 INVALID_STATUS_TRANSITION, versi basi 409 VERSION_CONFLICT, laporan arsip 409 ALREADY_ARCHIVED. Riwayat, audit, dan outbox (inbox pelapor) ditulis dalam transaksi yang sama.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ComplaintStatusInput"
      responses:
        "200":
          description: Respons berhasil.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComplaintEnvelope"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/admin/dashboard:
    get:
      operationId: adminDashboard
      tags:
        - Operations
      summary: Ringkasan pengurus
      x-status: implemented
      x-milestone: M07
      responses:
        "200":
          $ref: "#/components/responses/Data"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/admin/dues-charges:
    get:
      operationId: adminDuesCharges
      tags:
        - Finance
      summary: Daftar tagihan per rumah/periode/status
      x-status: implemented
      x-milestone: M11
      responses:
        "200":
          $ref: "#/components/responses/Data"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/admin/dues-recap:
    get:
      operationId: adminDuesRecap
      tags:
        - Finance
      summary: Rekap iuran bulanan pengurus
      description: Jumlah/nominal lunas dan belum per periode (default bulan berjalan WIB), tunggakan bulan sebelumnya, per kode rumah tanpa nama/kontak.
      x-status: implemented
      x-milestone: M11
      parameters:
        - name: periode
          in: query
          required: false
          schema: {type: string, pattern: '^\d{4}-\d{2}$'}
      responses:
        "200":
          description: Rekap periode.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DuesRecapEnvelope'}
        default:
          $ref: "#/components/responses/Error"
  /api/v1/admin/dues-payments:
    post:
      operationId: adminDuesPaymentsStore
      description: Saat flag v2 aktif, versi_keuangan 2 dan fingerprint preview wajib; kurang/lebih wajib pilihan eksplisit. Flag nonaktif mempertahankan kontrak M12 nominal tepat. Idempotency-Key wajib.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/M18PaymentInput'
                - type: object
                  description: Kontrak M12 saat flag nonaktif.
                  required: [periode, nominal, tanggal_bayar]
                  not: {required: [versi_keuangan], properties: {versi_keuangan: {type: integer}}}
                  properties:
                    rumah_id: {type: string, format: uuid}
                    periode: {type: array, minItems: 1, maxItems: 24, items: {type: string}}
                    nominal: {type: integer, minimum: 1}
                    tanggal_bayar: {type: string, format: date}
                    alasan: {type: string, maxLength: 300}
                    catatan: {type: [string, 'null'], maxLength: 500}
      tags:
        - Finance
      summary: Catat pembayaran iuran offline (sinkron, satu transaksi)
      x-status: implemented
      x-milestone: M12
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "201":
          $ref: "#/components/responses/Data"
        default:
          $ref: "#/components/responses/Error"
    get:
      operationId: getPaymentsAdminDuesPayments
      tags:
        - Finance
      summary: payments /admin/dues-payments
      x-status: implemented
      x-milestone: M12
      responses:
        "200":
          $ref: "#/components/responses/Data"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/admin/dues-payments/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: adminDuesPaymentsShow
      tags:
        - Finance
      summary: Detail pembayaran dan alokasi
      x-status: implemented
      x-milestone: M12
      responses:
        "200":
          $ref: "#/components/responses/Data"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/admin/dues-payments/{id}/correct:
    parameters:
      - $ref: "#/components/parameters/Id"
      - $ref: "#/components/parameters/IdempotencyKey"
    post:
      operationId: adminDuesPaymentsCorrect
      description: Saat flag v2 aktif, versi_keuangan 2 dan fingerprint preview wajib; kurang/lebih wajib pilihan eksplisit. Flag nonaktif mempertahankan kontrak M12 nominal tepat. Idempotency-Key wajib.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/M18PaymentInput'
                - type: object
                  description: Kontrak M12 saat flag nonaktif.
                  required: [periode, nominal, tanggal_bayar]
                  not: {required: [versi_keuangan], properties: {versi_keuangan: {type: integer}}}
                  properties:
                    rumah_id: {type: string, format: uuid}
                    periode: {type: array, minItems: 1, maxItems: 24, items: {type: string}}
                    nominal: {type: integer, minimum: 1}
                    tanggal_bayar: {type: string, format: date}
                    alasan: {type: string, maxLength: 300}
                    catatan: {type: [string, 'null'], maxLength: 500}
      tags:
        - Finance
      summary: Pembalikan + pengganti atomik
      x-status: implemented
      x-milestone: M12
      responses:
        "200":
          $ref: "#/components/responses/Data"
        default:
          $ref: "#/components/responses/Error"
