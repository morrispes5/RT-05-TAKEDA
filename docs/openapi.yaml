              schema:
                $ref: "#/components/schemas/HealthReady"
              example:
                status: ready
                checks:
                  database: ok
        "503":
          description: Dependency belum siap atau konfigurasi TLS database salah.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthReady"
              example:
                status: not_ready
                checks:
                  database: unavailable
security:
  - bearerAuth: []
  - cookieAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Token Sanctum per perangkat untuk mobile (M06). Tidak pernah dicontohkan dengan nilai nyata.
    cookieAuth:
      type: apiKey
      in: cookie
      name: rt05_api_session
      description: Sesi CMS web (M06). Mutation wajib header X-XSRF-TOKEN setelah GET /sanctum/csrf-cookie.
  headers:
    X-Request-Id:
      description: UUID request; sama dengan meta.request_id / error.request_id. Client boleh mengirim UUID sendiri.
      schema:
        type: string
        format: uuid
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Slug:
      name: slug
      in: path
      required: true
      schema:
        type: string
        pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
        maxLength: 160
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: UUID unik per niat transaksi. Key sama + payload sama → replay; payload beda → 409.
      schema:
        type: string
        format: uuid
  responses:
    Error:
      description: Error dengan bentuk standar.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NotFound:
      description: Resource tidak tersedia atau di luar scope.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            error:
              code: NOT_FOUND
              message: Data tidak ditemukan.
              request_id: 0f8e6c1e-7d3b-4c55-9a40-6f1f2d3e4b5a
    Data:
      description: Sukses dengan envelope data/meta.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/DataEnvelope"
  schemas:
    Meta:
      type: object
      required:
        - request_id
      properties:
        request_id:
          type: string
          format: uuid
    ErrorCode:
      type: string
      pattern: ^[A-Z][A-Z0-9_]+$
      description: "Kode umum: BAD_REQUEST, UNAUTHENTICATED, FORBIDDEN, NOT_FOUND, METHOD_NOT_ALLOWED, CONFLICT, PAYLOAD_TOO_LARGE,
        UNSUPPORTED_MEDIA_TYPE, CSRF_EXPIRED, VALIDATION_FAILED, TOO_MANY_REQUESTS, SERVICE_UNAVAILABLE, INTERNAL_ERROR. Kode domain:
        VERSION_CONFLICT, CHARGE_ALREADY_PAID, AMOUNT_MISMATCH, IDEMPOTENCY_KEY_REUSED, IDEMPOTENCY_IN_PROGRESS, HOUSE_ALREADY_REGISTERED,
        REGISTRATION_TOKEN_INVALID, PAYMENT_ALREADY_REVERSED, dll."
      x-known-values:
        - BAD_REQUEST
        - UNAUTHENTICATED
        - FORBIDDEN
        - NOT_FOUND
        - METHOD_NOT_ALLOWED
        - CONFLICT
        - PAYLOAD_TOO_LARGE
        - UNSUPPORTED_MEDIA_TYPE
        - CSRF_EXPIRED
        - VALIDATION_FAILED
        - TOO_MANY_REQUESTS
        - SERVICE_UNAVAILABLE
        - INTERNAL_ERROR
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          type: object
          additionalProperties: false
          required:
            - code
            - message
            - request_id
          properties:
            code:
              $ref: "#/components/schemas/ErrorCode"
            message:
              type: string
              minLength: 1
            fields:
              type: object
              description: Pesan validasi per field (hanya VALIDATION_FAILED).
              additionalProperties:
                type: array
                items:
                  type: string
            request_id:
              type: string
              format: uuid
    HealthLive:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          const: ok
    HealthReady:
      type: object
      additionalProperties: false
      required:
        - status
        - checks
      properties:
        status:
          type: string
          enum:
            - ready
            - not_ready
        checks:
          type: object
          additionalProperties: false
          required:
            - database
          properties:
