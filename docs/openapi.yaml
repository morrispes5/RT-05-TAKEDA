security:
  - bearerAuth: []
  - cookieAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Token Sanctum per perangkat untuk mobile (M06). Tidak pernah dicontohkan dengan nilai nyata.
    cookieAuth:
      type: apiKey
      in: cookie
      name: rt05_api_session
      description: Sesi CMS web (M06). Mutation wajib header X-XSRF-TOKEN dari cookie rt05_api_xsrf setelah GET /sanctum/csrf-cookie. Idle120 menit; versi_sesi mencabut cookie lama.
  headers:
    X-Request-Id:
      description: UUID request; sama dengan meta.request_id / error.request_id. Client boleh mengirim UUID sendiri.
      schema:
        type: string
        format: uuid
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Slug:
      name: slug
      in: path
      required: true
      schema:
        type: string
        pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
        maxLength: 160
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: UUID unik per niat transaksi. Key sama + payload sama → replay; payload beda → 409.
      schema:
        type: string
        format: uuid
  responses:
    Error:
      description: Error dengan bentuk standar.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NotFound:
      description: Resource tidak tersedia atau di luar scope.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            error:
              code: NOT_FOUND
              message: Data tidak ditemukan.
              request_id: 0f8e6c1e-7d3b-4c55-9a40-6f1f2d3e4b5a
    Data:
      description: Sukses dengan envelope data/meta.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/DataEnvelope"
  schemas:
    M18DepositCorrectionInput:
      allOf:
        - $ref: '#/components/schemas/M18ReasonInput'
        - type: object
          required: [periode, nominal, tanggal, fingerprint]
          properties:
            periode:
              type: array
              minItems: 1
              maxItems: 24
              uniqueItems: true
              items: {type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$'}
            nominal: {type: integer, minimum: 1, maximum: 1000000000}
            tanggal: {type: string, format: date}
            fingerprint: {type: string, pattern: '^[a-f0-9]{64}$'}
    M18CashCorrectionInput:
      allOf:
        - $ref: '#/components/schemas/M18ReasonInput'
        - type: object
          required: [jenis, nominal, tanggal, kategori, keterangan]
          properties:
            jenis: {type: string, enum: [pemasukan, pengeluaran]}
            nominal: {type: integer, minimum: 1, maximum: 1000000000}
            tanggal: {type: string, format: date}
            kategori: {type: string, maxLength: 60}
            keterangan: {type: string, minLength: 5, maxLength: 500}
            konfirmasi_saldo_negatif: {type: boolean}
    M18ReasonInput:
      type: object
      required: [versi_keuangan, alasan]
      properties:
        versi_keuangan: {type: integer, const: 2}
        alasan: {type: string, minLength: 5, maxLength: 300}
    M18PreviewInput:
      type: object
      required: [versi_keuangan, rumah_id, periode, nominal]
      properties:
        koreksi_pembayaran_id: {type: [string, 'null'], format: uuid, description: Pratinjau setelah pembalikan pembayaran asal rumah sama; fingerprint tetap ledger saat ini.}
        koreksi_penggunaan_id: {type: [string, 'null'], format: uuid, description: Pratinjau setelah pembalikan pemakaian titipan; saling eksklusif dengan koreksi_pembayaran_id.}
        versi_keuangan: {type: integer, const: 2}
        rumah_id: {type: string, format: uuid}
        periode:
          type: array
          minItems: 1
          maxItems: 24
          uniqueItems: true
          items: {type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$'}
        nominal: {type: integer, minimum: 1, maximum: 1000000000}
    M18PaymentInput:
      type: object
      required: [versi_keuangan, periode, nominal, tanggal_bayar, fingerprint]
      properties:
        versi_keuangan: {type: integer, const: 2}
        rumah_id: {type: string, format: uuid}
        periode:
          type: array
          minItems: 1
          maxItems: 24
          uniqueItems: true
          items: {type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$'}
        nominal: {type: integer, minimum: 1, maximum: 1000000000}
        tanggal_bayar: {type: string, format: date}
        fingerprint: {type: string, pattern: '^[a-f0-9]{64}$'}
        perlakuan_kurang: {type: [string, 'null'], enum: [kurang_bayar, keringanan, null]}
        perlakuan_lebih: {type: [string, 'null'], enum: [sumbangan, titipan, null]}
        alasan: {type: [string, 'null'], minLength: 5, maxLength: 300}
    M18RateInput:
      allOf:
        - $ref: '#/components/schemas/M18ReasonInput'
        - type: object
          required: [mulai_periode, nominal]
          properties:
            mulai_periode: {type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$'}
            nominal: {type: [integer, 'null'], minimum: 1000, maximum: 10000000}
    M18DepositInput:
      allOf:
        - $ref: '#/components/schemas/M18PreviewInput'
        - type: object
          required: [tanggal, fingerprint]
          properties:
            tanggal: {type: string, format: date}
            fingerprint: {type: string, pattern: '^[a-f0-9]{64}$'}
    M18ReliefInput:
      allOf:
        - $ref: '#/components/schemas/M18ReasonInput'
        - type: object
          required: [nominal]
          properties:
            nominal: {type: integer, minimum: 1, maximum: 1000000000}
    M18AdjustmentInput:
      allOf:
        - $ref: '#/components/schemas/M18ReasonInput'
        - type: object
          required: [delta]
          properties:
            delta: {type: integer, minimum: -10000000, maximum: 10000000, not: {const: 0}}
    NewPassword:
      type: string
      minLength: 8
      maxLength: 72
      writeOnly: true
      description: 'Minimal 8 karakter Unicode dengan huruf dan angka, maksimal 72 byte UTF-8, tanpa NUL. maxLength adalah batas karakter; server juga memeriksa batas byte sebelum bcrypt.'
    RegistrationCredentials:
      type: object
      required: [email, password, password_confirmation, registration_token, device_name, jalan, nomor]
      properties:
        email: {type: string, format: email, maxLength: 254}
        password: {$ref: '#/components/schemas/NewPassword'}
        password_confirmation: {type: string, writeOnly: true}
        registration_token: {type: string, pattern: '^[0-9]{6}$', writeOnly: true, description: 'String; nol di depan dipertahankan. Bukan OTP atau hak admin.'}
        device_name: {type: string, minLength: 1, maxLength: 100}
        blok: {type: [string, 'null'], maxLength: 30}
        jalan: {type: string, minLength: 1, maxLength: 150}
        nomor: {type: string, minLength: 1, maxLength: 20}
    PrimaryRegistrationInput:
      allOf:
        - $ref: "#/components/schemas/RegistrationCredentials"
        - type: object
          required: [nama_kepala, jenis_hunian]
          properties:
            nama_kepala: {type: string, minLength: 1, maxLength: 120}
            jenis_hunian: {type: string, enum: [pemilik, kontrak]}
            whatsapp: {type: [string, 'null'], maxLength: 25}
            anggota:
              type: array
              maxItems: 15
              items:
                type: object
                required: [nama, hubungan_keluarga]
                properties:
                  nama: {type: string, minLength: 1, maxLength: 120}
                  hubungan_keluarga: {type: string, minLength: 1, maxLength: 40}
    AdditionalRegistrationInput:
      type: object
      description: 'ADR34: yang wajib hanya nama pemohon, hubungan, dan nama kepala keluarga. Alamat (blok/jalan/nomor) opsional; rumah dicocokkan otomatis dari alamat lengkap bila diisi, selain itu dari nama kepala yang unik.'
      required: [email, password, password_confirmation, registration_token, device_name, nama, hubungan_keluarga, nama_kepala]
      properties:
        email: {type: string, format: email, maxLength: 254}
        password: {$ref: '#/components/schemas/NewPassword'}
        password_confirmation: {type: string, writeOnly: true}
        registration_token: {type: string, pattern: '^[0-9]{6}$', writeOnly: true, description: 'String; nol di depan dipertahankan. Bukan OTP atau hak admin.'}
        device_name: {type: string, minLength: 1, maxLength: 100}
        nama: {type: string, minLength: 2, maxLength: 120}
        hubungan_keluarga: {type: string, minLength: 1, maxLength: 40}
        nama_kepala: {type: string, minLength: 2, maxLength: 120}
        blok: {type: [string, 'null'], maxLength: 30}
        jalan: {type: [string, 'null'], maxLength: 150}
        nomor: {type: [string, 'null'], maxLength: 20}
    WebLoginInput:
      type: object
      required: [email, password]
      properties:
        email: {type: string, format: email, maxLength: 254}
        password: {type: string, maxLength: 200, writeOnly: true}
    MobileLoginInput:
      allOf:
        - $ref: "#/components/schemas/WebLoginInput"
        - type: object
          required: [device_name]
          properties:
            device_name: {type: string, minLength: 1, maxLength: 100}
    ForgotPasswordInput:
      type: object
      required: [email]
      properties:
        email: {type: string, format: email, maxLength: 254}
    ResetPasswordInput:
      type: object
      required: [email, token, password, password_confirmation]
      properties:
        email: {type: string, format: email}
        token: {type: string, writeOnly: true}
        password: {$ref: '#/components/schemas/NewPassword'}
        password_confirmation: {type: string, writeOnly: true}
    ChangePasswordInput:
      type: object
      required: [current_password, password, password_confirmation]
      properties:
        current_password: {type: string, maxLength: 72, writeOnly: true, description: 'Kecocokan persis password lama; maksimal 72 byte UTF-8 tanpa NUL. Tidak menerapkan kekuatan password baru.'}
        password: {$ref: '#/components/schemas/NewPassword'}
        password_confirmation: {type: string, writeOnly: true}
    PasswordConfirmationInput:
      type: object
      required: [password]
      properties:
        password: {type: string, maxLength: 72, writeOnly: true, description: 'Kecocokan persis password lama; maksimal 72 byte UTF-8 tanpa NUL. Tidak menerapkan kekuatan password baru.'}
    AuthAccount:
      type: object
      additionalProperties: false
      required: [id, nama, email, peran, super_admin, jenis, status, rumah, keluarga_id, dapat_ubah_keluarga, privasi_versi, privasi_perlu_setuju]
      properties:
        privasi_versi: {type: string, description: 'Versi Kebijakan Privasi terbaru (ADR35).'}
        privasi_perlu_setuju: {type: boolean, description: 'true bila akun belum menyetujui versi terbaru; aplikasi menampilkan kebijakan lebih dulu.'}
        id: {type: string, format: uuid}
        nama: {type: string}
        email: {type: string, format: email}
        peran: {type: string, enum: [warga, pengurus]}
        versi_keuangan: {type: integer, enum: [1, 2], description: Versi alur keuangan yang aktif di server.}
        super_admin: {type: boolean, description: 'ADR43 (M17): true hanya untuk pengurus aktif dengan email super admin; aplikasi menampilkan tombol ubah peran.'}
        jenis: {type: string, enum: [utama, tambahan]}
        status: {type: string, enum: [menunggu, aktif, nonaktif, diarsipkan]}
        keluarga_id: {type: [string, 'null'], format: uuid}
        dapat_ubah_keluarga: {type: boolean}
        rumah:
          type: [object, 'null']
          required: [id, kode_rumah, alamat]
          additionalProperties: false
          properties:
            id: {type: string, format: uuid}
            kode_rumah: {type: string}
            alamat: {type: string}
    AccountEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/AuthAccount"
        meta:
          $ref: "#/components/schemas/Meta"
    MobileAuthEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        meta:
          $ref: "#/components/schemas/Meta"
        data:
          type: object
          additionalProperties: false
          required: [token, token_type, expires_at, akun]
          properties:
            token: {type: string, description: 'Bearer rahasia; tidak dicontohkan dengan nilai nyata.'}
            token_type: {type: string, const: Bearer}
            expires_at: {type: string, format: date-time}
            akun:
              $ref: "#/components/schemas/AuthAccount"
    MessageEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        meta:
          $ref: "#/components/schemas/Meta"
        data:
          type: object
          required: [message]
          additionalProperties: false
          properties:
            message: {type: string}
    Meta:
      type: object
      required:
        - request_id
      properties:
        request_id:
          type: string
          format: uuid
    ErrorCode:
      type: string
      pattern: ^[A-Z][A-Z0-9_]+$
      description: "Kode umum: BAD_REQUEST, UNAUTHENTICATED, FORBIDDEN, NOT_FOUND, METHOD_NOT_ALLOWED, CONFLICT, PAYLOAD_TOO_LARGE,
        UNSUPPORTED_MEDIA_TYPE, CSRF_EXPIRED, VALIDATION_FAILED, TOO_MANY_REQUESTS, SERVICE_UNAVAILABLE, INTERNAL_ERROR. Kode domain:
        VERSION_CONFLICT, CHARGE_ALREADY_PAID, AMOUNT_MISMATCH, IDEMPOTENCY_KEY_REUSED, IDEMPOTENCY_IN_PROGRESS, HOUSE_ALREADY_REGISTERED,
        REGISTRATION_TOKEN_INVALID, PAYMENT_ALREADY_REVERSED, dll."
      x-known-values:
        - BAD_REQUEST
        - UNAUTHENTICATED
        - FORBIDDEN
        - NOT_FOUND
        - METHOD_NOT_ALLOWED
        - CONFLICT
        - PAYLOAD_TOO_LARGE
        - UNSUPPORTED_MEDIA_TYPE
        - CSRF_EXPIRED
        - VALIDATION_FAILED
        - TOO_MANY_REQUESTS
        - SERVICE_UNAVAILABLE
        - INTERNAL_ERROR
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          type: object
          additionalProperties: false
          required:
            - code
            - message
            - request_id
          properties:
            code:
              $ref: "#/components/schemas/ErrorCode"
            message:
              type: string
              minLength: 1
            fields:
              type: object
              description: Pesan validasi per field (hanya VALIDATION_FAILED).
              additionalProperties:
                type: array
                items:
                  type: string
            request_id:
              type: string
              format: uuid
    HealthLive:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          const: ok
    HealthReady:
      type: object
      additionalProperties: false
      required:
        - status
        - checks
      properties:
        status:
          type: string
          enum:
            - ready
            - not_ready
        checks:
          type: object
          additionalProperties: false
          required:
            - database
          properties:
            database:
              type: string
              enum:
                - ok
                - unavailable
                - misconfigured
    ServiceInfo:
      type: object
      additionalProperties: false
      required:
        - name
        - api_version
      properties:
        name:
          type: string
        api_version:
          const: v1
    ServiceInfoEnvelope:
      type: object
      additionalProperties: false
      required:
        - data
        - meta
      properties:
        data:
          $ref: "#/components/schemas/ServiceInfo"
        meta:
          $ref: "#/components/schemas/Meta"
    DataEnvelope:
      type: object
      required:
        - data
        - meta
      properties:
        data: {}
        meta:
          $ref: "#/components/schemas/Meta"
        links:
          type: object
    Versi:
      type: integer
      minimum: 1
      description: Optimistic version (keluarga.versi atau rumah.versi). Nilai basi → 409 VERSION_CONFLICT.
    Whatsapp:
      type: [string, 'null']
      maxLength: 25
      pattern: '^[0-9+ -]{8,25}$'
    ReasonInput:
      type: object
      required: [alasan]
      properties:
        alasan: {type: string, minLength: 1, maxLength: 300}
    OptionalVersionInput:
      type: object
      required: [versi]
      properties:
        versi: {$ref: '#/components/schemas/Versi'}
    AccountStatusInput:
      type: object
      required: [status, alasan]
      description: Tidak menerima peran; grant/revoke pengurus hanya command operator.
      properties:
        status: {type: string, enum: [aktif, nonaktif]}
        alasan: {type: string, minLength: 1, maxLength: 300}
    ApproveRequestInput:
      type: object
      properties:
        rumah_id: {type: [string, 'null'], format: uuid}
        warga_id: {type: [string, 'null'], format: uuid, description: Anggota aktif keluarga rumah tersebut yang belum punya akun.}
        catatan: {type: [string, 'null'], maxLength: 300}
    HouseholdUpdateInput:
      type: object
      required: [versi]
      properties:
        versi: {$ref: '#/components/schemas/Versi'}
        whatsapp: {$ref: '#/components/schemas/Whatsapp'}
        nama_kepala: {type: string, minLength: 1, maxLength: 120}
        nomor_kk: {$ref: '#/components/schemas/IdentityNumber'}
