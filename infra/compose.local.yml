# Layanan pengembangan lokal. Hanya terikat ke 127.0.0.1; tidak dipakai di VPS.
#   docker compose -f infra/compose.local.yml up -d
# Postgres 17 mengikuti versi project Neon yang direncanakan. Redis/SMTP capture ditambahkan M03.
name: rt05-local

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local-dev-only
      TZ: UTC
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - rt05-pg-local:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
      # Dirujuk oleh init melalui \ir ../../../sql/... (resolve ke /sql di container).
      - ./sql:/sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rt05_test"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  rt05-pg-local:
