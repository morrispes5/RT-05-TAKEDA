name: Mobile release APK
# M15: APK rilis bertanda tangan kunci tetap (distribusi warga tanpa Play Store, ADR31).
# Hanya dijalankan manual. Kunci ada di secret environment `release`; sidik jari sertifikat di
# repository variable RT05_RELEASE_CERT_SHA256 dan diverifikasi sebelum APK diunggah sebagai artifact.
on:
  workflow_dispatch:
    inputs:
      flavor:
        description: 'Target rilis (staging untuk kandidat/UAT, prod untuk warga).'
        required: true
        default: staging
        type: choice
        options:
          - staging
          - prod
      catatan:
        description: 'Catatan rilis untuk halaman unduh (pisahkan baris dengan \n; tanpa data warga).'
        required: false
        default: ''
        type: string
permissions:
  contents: read
concurrency:
  group: mobile-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: node ../infra/scripts/check-mobile-build-config.mjs --self-test
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Tulis kunci rilis sementara
        env:
          KEYSTORE_BASE64: ${{ secrets.RT05_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RT05_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RT05_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RT05_KEY_PASSWORD }}
        run: |
          set -eu
          test -n "$KEYSTORE_BASE64" && test -n "$KEYSTORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD"
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/rt05-release.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$RUNNER_TEMP/rt05-release.jks" "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > android/key.properties
      - name: Build APK rilis
        env:
          RT05_FLAVOR: ${{ inputs.flavor }}
          # Domain production dipilih pemilik (M16 K1): repository variable RT05_PROD_BASE_URL; kosong = default skrip.
          RT05_API_BASE_URL: ${{ inputs.flavor == 'prod' && vars.RT05_PROD_BASE_URL || inputs.flavor == 'staging' && 'https://takeda-staging.morriz.tech' || '' }}
          RT05_RELEASE_NOTES: ${{ inputs.catatan }}
          RT05_FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
          RT05_FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID }}
          RT05_FIREBASE_SENDER_ID: ${{ vars.FIREBASE_SENDER_ID }}
          RT05_FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
        # versionCode naik tiap rilis; 1000 + nomor run agar selalu di atas APK debug (versionCode 1).
        run: RT05_BUILD_NUMBER=$((1000 + GITHUB_RUN_NUMBER)) node ../infra/scripts/check-mobile-build-config.mjs --build-release
      - name: Hapus kunci dari runner
        if: always()
        run: rm -f android/key.properties "$RUNNER_TEMP/rt05-release.jks"
      - name: Verifikasi sertifikat = kunci rilis tetap
        env:
          RT05_RELEASE_CERT_SHA256: ${{ vars.RT05_RELEASE_CERT_SHA256 }}
        run: |
          set -eu
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          for apk in build/app/outputs/flutter-apk/rt05-takeda-${{ inputs.flavor }}-*.apk; do
            echo "$apk"
            "$apksigner" verify --verbose "$apk" | grep -E '^Verified using v2 scheme \(APK Signature Scheme v2\): true$'
            "$apksigner" verify --print-certs "$apk" | node ../infra/scripts/check-mobile-build-config.mjs --verify-cert
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rt05-takeda-${{ inputs.flavor }}-release-${{ github.run_number }}
          path: |
            mobile/build/app/outputs/flutter-apk/rt05-takeda-${{ inputs.flavor }}-*.apk
            mobile/build/app/outputs/flutter-apk/rt05-takeda-${{ inputs.flavor }}-*.apk.sha256
            mobile/build/app/outputs/flutter-apk/rt05-takeda-${{ inputs.flavor }}-*-versi.json
          retention-days: 90
          if-no-files-found: error
