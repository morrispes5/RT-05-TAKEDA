name: Mobile verification
on:
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile.yml'
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile.yml'
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'API_BASE_URL untuk APK (default emulator → PC lokal)'
        required: false
        default: 'http://10.0.2.2:8077'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    env:
      API_BASE_URL: ${{ inputs.api_base_url || 'http://10.0.2.2:8077' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test || true
      - run: flutter analyze
      - run: flutter test
      # APK debug (ditandatangani debug key) untuk demo emulator/HP uji; bukan rilis production.
      - run: flutter build apk --debug --dart-define=API_BASE_URL=$API_BASE_URL --dart-define=FLAVOR=dev
      - run: sha256sum build/app/outputs/flutter-apk/app-debug.apk | tee build/app/outputs/flutter-apk/app-debug.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: rt05-takeda-debug-apk
          path: |
            mobile/build/app/outputs/flutter-apk/app-debug.apk
            mobile/build/app/outputs/flutter-apk/app-debug.apk.sha256
          retention-days: 14
